[workspace]
resolver = "3"
members = [
    "crates/trigon-core",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/trigon-dev/trigon"
authors = ["The Trigon Authors"]

[workspace.dependencies]
trigon-core = { path = "crates/trigon-core", version = "0.0.0" }
trigon-archive = { path = "crates/trigon-archive", version = "0.0.0" }
trigon-stabilize = { path = "crates/trigon-stabilize", version = "0.0.0" }
trigon-compare = { path = "crates/trigon-compare", version = "0.0.0" }

# Judgement half: sync, no tokio, no reqwest. See docs/01-architecture.md §2.2.
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
crc32fast = "1"
bytes = "1"
memmap2 = "0.9"
tempfile = "3"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
smallvec = { version = "1", features = ["union"] }

# Search half and tooling only.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
proptest = "1"

[profile.release]
debug = 1
overflow-checks = true

[profile.bench]
debug = 1
