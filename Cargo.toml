[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/trigon-core",
    "crates/trigon-archive",
    "crates/trigon-stabilize",
    "crates/trigon-compare",
    "crates/trigon-strategy",
    "crates/trigon-attest",
    "crates/trigon-sandbox",
    "crates/trigon-registry",
    "crates/trigon-mirror",
    "crates/trigon",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/trigon-dev/trigon"
authors = ["The Trigon Authors"]

[workspace.dependencies]
trigon-core = { path = "crates/trigon-core", version = "0.0.0" }
trigon-archive = { path = "crates/trigon-archive", version = "0.0.0" }
trigon-stabilize = { path = "crates/trigon-stabilize", version = "0.0.0" }
trigon-compare = { path = "crates/trigon-compare", version = "0.0.0" }
trigon-strategy = { path = "crates/trigon-strategy", version = "0.0.0" }
trigon-attest = { path = "crates/trigon-attest", version = "0.0.0" }
trigon-sandbox = { path = "crates/trigon-sandbox", version = "0.0.0" }
trigon-registry = { path = "crates/trigon-registry", version = "0.0.0" }
trigon-mirror = { path = "crates/trigon-mirror", version = "0.0.0" }

# Judgement half: sync, no tokio, no reqwest. See docs/01-architecture.md §2.2.
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
crc32fast = "1"
bytes = "1"
memmap2 = "0.9"
tempfile = "3"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
smallvec = { version = "1", features = ["union"] }
# Signing. Pure Rust, no runtime: the verifier build links this and nothing that can open a socket.
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"

# Instrumentation. `tracing` itself is pure: no runtime, no network, no allocation when nothing is
# subscribed, so the judgement-half crates may use it. The subscriber lives in the binary.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }

# Strategy documents. `serde_yaml` is archived; `serde_yaml_ng` is the maintained fork.
# `serde_path_to_error` is what turns "data did not match any variant" into a path a repair loop can
# act on, which docs/04 §2.2 argues is the highest-return dependency in the design.
serde_yaml_ng = "0.10"
serde_path_to_error = "0.1"
minijinja = { version = "2", default-features = false, features = ["builtins", "loader", "serde"] }

# Search half and tooling only. Nothing above the judgement line may reach these: the policy test
# in xtask enforces it, and `cargo tree` on the shipped verifier is the claim a sceptic can check.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs", "signal"] }
async-trait = "0.1"
# rustls rather than the system OpenSSL: one fewer thing that differs between a laptop and a worker
# node, and no C toolchain in the build.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "ansi", "std"] }
proptest = "1"
toml = "0.8"
regex = "1"

[profile.release]
debug = 1
overflow-checks = true

# Dependencies are optimized even in dev builds. The corpus tools push hundreds of megabytes
# through sha2, flate2 and crc32fast, and an unoptimized build of those turns a differential run
# from a couple of minutes into the better part of an hour. Our own crates stay at opt-level 0,
# so a backtrace through the parser is still readable.
[profile.dev.package."*"]
opt-level = 3

[profile.bench]
debug = 1
