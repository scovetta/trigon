name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # The judgement half cannot reach a runtime, a network client, or the AI crate.
  # See docs/01-architecture.md §2.2. This is an M0 exit criterion, so it gets its own job.
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- policy
      # Feature unification is the failure mode a plain build hides.
      - run: cargo install cargo-hack --locked
      - run: cargo hack check --feature-powerset -p trigon-core -p trigon-archive -p trigon-stabilize -p trigon-compare

  # "Here is a binary with no network client and no model code that reproduces our verdict."
  verifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The verifier is the --no-default-features build. The default one can build packages and
      # therefore links a runtime; this one reproduces a verdict from two artifacts and nothing
      # else, which is what someone who does not trust us can check for themselves.
      - run: cargo build -p trigon --no-default-features --release
      - name: the verifier links nothing from the search half
        run: |
          if cargo tree -p trigon --no-default-features --edges normal --prefix none \
              | grep -Ei '^(tokio|reqwest|hyper|trigon-sandbox) '; then
            echo "::error::the verifier build links a runtime or a network client"
            exit 1
          fi
          echo "clean"
      # And the default build still compiles, since nothing else in CI exercises the feature.
      - run: cargo build -p trigon --release
