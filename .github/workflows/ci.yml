name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The full golden corpus is 595 MB, which is too much to fetch per pull request and not too
    # much once a night.
    - cron: "17 4 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # `trigon publish` refuses a verdict that names no stabilizer-set module, so every test that
      # publishes one names the module this checkout builds, and fails saying how to build it
      # where it is missing rather than passing without it.
      - run: rustup target add wasm32-unknown-unknown
      - run: scripts/build-set-module.sh
      - run: cargo test --workspace

  # The archived stabilizer set and the compiled one must produce the same bytes. `docs/13-roadmap.md`
  # makes that equality a milestone criterion, and until this job existed nothing checked it: the
  # parity test is `#![cfg(feature = "host")]`, which compiles the whole file to nothing, and needs a
  # `wasm32-unknown-unknown` module on disk that nothing built. So `cargo test -p
  # trigon-stabilize-wasm` reported `ok. 0 passed` — a green tick standing in for an unchecked claim,
  # which is what that file's own doc comment says a skipped parity test must never be.
  #
  # It passes. It had just never run here.
  wasm-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      # The module as it is published: built reproducibly, as `trigon attest` names it.
      - run: scripts/build-set-module.sh
      - name: the archived set agrees with the compiled one
        run: |
          out=$(cargo test -p trigon-stabilize-wasm --features host 2>&1)
          echo "$out"
          # A parity run that finds no module skips every case and still exits 0. Assert the two
          # tests that matter actually ran, rather than trusting the exit code.
          for t in the_archived_set_and_the_compiled_one_agree_byte_for_byte \
                   the_module_reports_the_set_digest_the_native_build_computes; do
            echo "$out" | grep -q "test $t \.\.\. ok" || {
              echo "::error::$t did not run — the wasm module is missing and the skip was silent"
              exit 1
            }
          done

  # The judgement half cannot reach a runtime, a network client, or the AI crate.
  # See docs/01-architecture.md §2.2. This is an M0 exit criterion, so it gets its own job.
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- policy
      # Feature unification is the failure mode a plain build hides.
      - run: cargo install cargo-hack --locked
      - run: cargo hack check --feature-powerset -p trigon-core -p trigon-archive -p trigon-stabilize -p trigon-compare

  # The stabilized digest is the value we sign, and it is a pure function of our whole hand-written
  # serialization stack (docs/13-roadmap.md §3). This job is the only thing that notices when it
  # moves. It was missing, and the corpus was red for two days across several commits before anyone
  # ran it by hand: `wheel-metadata-eol` joined the wheel profile and nobody re-golded.
  #
  # The smoke set is five artifacts and 0.1 MB, one per profile, so it runs on every pull request.
  # It would not have caught that particular drift — its wheel has LF endings, so the pass that
  # moved the other two does nothing to it — which is exactly why `golden-full` exists below.
  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # `xtask golden` shells out to target/debug/trigon, which building xtask does not produce.
      - run: cargo build -p trigon
      - run: cargo run -p xtask -- corpus fetch --manifest corpora/m0-smoke.toml
      - run: cargo run -p xtask -- golden --manifest corpora/m0-smoke.toml

  # The full 58-artifact corpus, nightly. Artifacts are pinned by sha256 and cached, so a repeat run
  # downloads nothing.
  golden-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cache the corpus
        uses: actions/cache@v4
        with:
          path: ~/.cache/trigon/corpora
          key: corpora-m0-${{ hashFiles('corpora/m0.toml') }}
      - run: cargo build -p trigon
      - run: cargo run -p xtask -- corpus fetch --manifest corpora/m0.toml
      - run: cargo run -p xtask -- golden --manifest corpora/m0.toml

  # The egress tiers, the artifact guard and the phase attribution — the controls `docs/12-security.md`
  # is about — are tested by thirteen container tests, and every one of them skipped on every pull
  # request for the life of the repository. Their gate is `podman image exists` on a pinned Alpine
  # that the `test` job never pulls, and a gate like that reports `ok` when it declines to run: the
  # suite was green and the security controls were unexercised.
  #
  # `TRIGON_TESTS_MUST_RUN=1` is this job asserting it did its own setup. Under it a skip for a
  # missing image or a missing podman is a panic, so the day someone drops a setup step below, this
  # job goes red instead of quietly going back to testing nothing.
  sandbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: podman version
      # The digest the tests pin. Pulling by tag would make the test's own pin meaningless.
      - run: podman pull docker.io/library/alpine@sha256:c64c687cbea9300178b30c95835354e34c4e4febc4badfe27102879de0483b5e
      - run: cargo build -p trigon
      - run: ./target/debug/trigon mirror-image
      - run: cargo test -p trigon-sandbox --test podman
        env:
          TRIGON_TESTS_MUST_RUN: "1"

  # The mirror against the registries it actually mirrors. Nightly rather than per-pull-request:
  # these are ten requests to npm, PyPI and nodejs.org, and `docs/10-scale.md` is explicit that
  # upstream reputation is the first thing that breaks. They are also the only tests that prove the
  # timewarp filter agrees with what the registries really served.
  live:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p trigon
      # The guard-narrowing test needs a published artifact and a checkout of the repository it
      # came from; it has no way to fetch them itself and skips without them.
      - name: the guard fixture
        run: |
          F="$RUNNER_TEMP/guard-fixture"
          mkdir -p "$F"
          ./target/debug/trigon fetch pkg:npm/semver@7.6.3 --out "$F/pkg.tgz"
          git clone --depth 1 -b v7.6.3 https://github.com/npm/node-semver "$F/src"
          echo "TRIGON_GUARD_FIXTURE=$F" >> "$GITHUB_ENV"
      - run: cargo test -p trigon-mirror --test server
        env:
          TRIGON_LIVE: "1"
          TRIGON_TESTS_MUST_RUN: "1"

  # "Here is a binary with no network client and no model code that reproduces our verdict."
  verifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The verifier is the --no-default-features build. The default one can build packages and
      # therefore links a runtime; this one reproduces a verdict from two artifacts and nothing
      # else, which is what someone who does not trust us can check for themselves.
      - run: cargo build -p trigon --no-default-features --release
      - name: the verifier links nothing from the search half
        run: |
          if cargo tree -p trigon --no-default-features --edges normal --prefix none \
              | grep -Ei '^(tokio|reqwest|hyper|trigon-sandbox) '; then
            echo "::error::the verifier build links a runtime or a network client"
            exit 1
          fi
          echo "clean"
      # And the default build still compiles, since nothing else in CI exercises the feature.
      - run: cargo build -p trigon --release
