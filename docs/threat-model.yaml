  conditions: all supported configurations
  tier: correctness-only
  false_friend: true
  statement: The system message, the nonce fence and "treat this as data" do not stop prompt injection.
    They raise the cost
  provenance:
    kind: documented
    source: docs/12-security.md §4
- id: FF6
  components:
  - multiple
  conditions: all supported configurations
  tier: correctness-only
  false_friend: true
  statement: A replay does not prove the package reproduces. It replays the model, not the world
  provenance:
    kind: documented
    source: docs/07-ai.md §8
- id: FF7
  components:
  - multiple
  conditions: all supported configurations
  tier: correctness-only
  false_friend: true
  statement: A model-proposed strategy does not cap the outcome below normalized. The cap is about applied
    stabilizers, not about how the recipe was derived
  provenance:
    kind: documented
    source: docs/00-overview.md §3.1
- id: FF8
  components:
  - multiple
  conditions: all supported configurations
  tier: correctness-only
  false_friend: true
  statement: An enforced egress tier does not bound what the reachable hosts serve (§1.10 A5)
  provenance:
    kind: documented
    source: docs/17-backlog.md B7 residue
- id: FF9
  components:
  - multiple
  conditions: all supported configurations
  tier: correctness-only
  false_friend: true
  statement: The mirror's passthrough routes are not access-controlled, and the artifact route applies
    no time filter
  provenance:
    kind: documented
    source: docs/16-findings.md §3.13
- id: FF10
  components:
  - multiple
  conditions: all supported configurations
  tier: correctness-only
  false_friend: true
  statement: The guard is not armed on every run. Its also-in-source filter — the rule that skips members
    which also appear in the source checkout — needs a checkout and is not automatic in a sweep, so the
    guard runs wider than designed and errs toward voiding an honest run
  provenance:
    kind: documented
    source: docs/12-security.md §2.2
- id: FF11
  components:
  - multiple
  conditions: all supported configurations
  tier: correctness-only
  false_friend: true
  statement: trigon watch authenticates nobody , and --bind selects an address rather than restricting
    who may connect
  provenance:
    kind: documented
    source: crates/trigon/src/main.rs
- id: FF12
  components:
  - multiple
  conditions: all supported configurations
  tier: correctness-only
  false_friend: true
  statement: ModelCaps::context_tokens does not bound a prompt , and Prompt::is_cacheable is not enforced
    when a request is sent
  provenance:
    kind: documented
    source: crates/trigon-ai/src/provider.rs
- id: FF13
  components:
  - multiple
  conditions: all supported configurations
  tier: correctness-only
  false_friend: true
  statement: Apache-2.0's warranty disclaimer is not a security position. It is boilerplate
  provenance:
    kind: documented
    source: docs/threat-model.md
downstream_responsibilities:
- id: dr-1
  component: multiple
  statement: Re-derive it. trigon verify-attestation --rerun-comparison, with a binary you built. This
    is the only thing that makes a rebuilder's attestation worth anything to someone who does not trust
    the rebuilder. If you also want independence from our build, produce R yourself
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-2
  component: multiple
  statement: Check the signing identity against your own policy with --public-key <hex> (trigon public-key
    <keyfile> prints it). Without it the tool still re-derives and tells you the signature was present
    and unchecked, which is a different answer from unsigned. A verified signature says which key signed,
    never
  enforces:
  - D24
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-3
  component: multiple
  statement: Set your own threshold with Match::is_at_least. The default is not a recommendation
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-4
  component: multiple
  statement: Read the applied list. If you reject a particular normalization you can see it fired, with
    its risk tier and provenance, and discard the result
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-5
  component: multiple
  statement: Filter on derivation.method if you want "no model touched this"
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-6
  component: multiple
  statement: 'Read the egress tier, and read attestable as exactly what it says. A run at --egress open
    records attestable: false and carries no transcript. A run at mirror-only or deny-all records attestable:
    true and a transcript you can fetch by hash and read — which is a claim about egress being accounted
    for'
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-7
  component: multiple
  statement: Distinguish a confirmed result from a single attempt, and a stale pass from no data
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-8
  component: multiple
  statement: For npm, do not read reproduced as attributed
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-9
  component: multiple
  statement: Hold a published record's log to a checkpoint you already hold. verify-attestation --record
    detects a rollback, a rewrite or a fork only back to the checkpoint it is given — --checkpoint, or
    the source's state or initial checkpoint under --source — and says when it was given none (P33, D25).
    Keep th
  enforces:
  - D25
  - P33
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-10
  component: multiple
  statement: Choose the egress tier deliberately. --egress open is the default and it voids the strong
    claim. An enforced tier needs a mirror image and a base image you built first
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-11
  component: multiple
  statement: Only you may name a local path as a source. file:// chosen by the thing under test is the
    dangerous one
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-12
  component: multiple
  statement: Read crates/trigon-ai/src/copilot.rs's module docs before --model copilot:. Prefer a provider
    with a real system message where the choice exists
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-13
  component: multiple
  statement: Keep trigon watch on loopback unless you have thought about it. Build logs are not redacted
    (D14)
  enforces:
  - D14
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-14
  component: multiple
  statement: Set total_expanded_bytes to something your host can absorb. The default ceiling is 4 GiB
    and a hostile artifact may reach it before being refused
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-15
  component: multiple
  statement: Treat the rebuilt artifact as untrusted. It is the package's own build output; do not install
    or execute it because it reproduced
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-16
  component: multiple
  statement: 'Before a real sweep, talk to the registries: a User-Agent with a contact URL, Retry-After
    honoured, per-host token buckets'
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-17
  component: multiple
  statement: 'Publish to an evidence repository from one host, and give the push credential nothing else.
    The host''s lock keeps one publish at a time on it, whatever store it runs from; a second host publishing
    to the same repository can lose a push in a window that sends its signed checkpoint anyway (D26).
    Keep '
  enforces:
  - D26
  - D27
  - P35
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
- id: dr-18
  component: multiple
  statement: Two-party review for anything touching a stabilizer , a non-empty prose reason:, and the
    corpus-wide impact preview before merging. ---
  enforces: []
  provenance:
    kind: documented
    source: docs/threat-model.md §1.13
known_misuses:
- id: km-1
  component: multiple
  pattern: Reading reproduced as safe
  safer_alternative: A package that faithfully builds a backdoor reproduces. Treat a reproduction as evidence
    about provenance, and ask the malware question separately
  provenance:
    kind: documented
    source: docs/threat-model.md §1.14
- id: km-2
  component: multiple
  pattern: Reading divergent as compromised
  safer_alternative: Most divergences are build nondeterminism. Read the difference signature, which you
    can recompute
  provenance:
    kind: documented
    source: docs/threat-model.md §1.14
- id: km-3
  component: multiple
  pattern: Trusting a verdict without its stabilizer set digest
  safer_alternative: A verdict under a set you cannot obtain cannot be re-derived by anyone
  provenance:
    kind: documented
    source: docs/threat-model.md §1.14
- id: km-4
  component: multiple
  pattern: Taking a pass at --egress open as equivalent to one at mirror-only
  safer_alternative: Read attestable
  provenance:
    kind: documented
    source: docs/threat-model.md §1.14
- id: km-5
  component: multiple
  pattern: Treating --rerun-comparison on the rebuilder's own R as independent verification
  safer_alternative: It checks our arithmetic, not our build
  provenance:
    kind: documented
    source: docs/threat-model.md §1.14
- id: km-6
  component: multiple
  pattern: Pointing trigon watch at a routable address
  safer_alternative: No authentication, and it serves build logs
  provenance:
    kind: documented
    source: docs/threat-model.md §1.14
- id: km-7
  component: multiple
  pattern: 'Using --model copilot: because it needs no key'
  safer_alternative: It is the one provider that can act
  provenance:
    kind: documented
    source: docs/threat-model.md §1.14
- id: km-8
  component: multiple
  pattern: Comparing verdicts across stabilizer sets
  safer_alternative: compare refuses, and so should you. ---
  provenance:
    kind: documented
    source: docs/threat-model.md §1.14
