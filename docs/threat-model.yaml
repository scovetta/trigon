  component: multiple
  parameters:
  - name: the bundle
    attacker_controllable: true
    control_kinds:
    - data
    - serialized-state
    caller_must_enforce: the signature is checked only with --public-key, and the tool says which it did
    provenance:
      kind: documented
      source: README.md
- id: verify-attestation --record
  component: multiple
  parameters:
  - name: the record file
    attacker_controllable: true
    control_kinds:
    - data
    - serialized-state
    caller_must_enforce: 'nothing — P31: its sha256 must be a verified leaf''s, and one leaf''s only,
      every envelope must verify under the key its source had at that leaf, its statement must agree with
      the leaf, its unsigned map with its statement, and every evidence file present with its digest;
      a record no leaf names is unlogged and fails, and so does one the log holds twice'
    provenance:
      kind: documented
      source: docs/19-distribution-and-lookup.md §4.1, §8; crates/trigon-attest/tests/evidence_repo/records.rs
  - name: 'the evidence directory: log/, records/, evidence/, index/'
    attacker_controllable: true
    control_kinds:
    - data
    - size
    - object-topology
    - resource-name
    caller_must_enforce: 'nothing — P32, P33: the log is verified whole under the pinned log key, and
      against the checkpoint last accepted, before a record is read; every file is read inside the directory,
      as a regular file of at most its kind''s length; index/ is never read; a leaf whose record file
      is missing is deleted'
    provenance:
      kind: documented
      source: docs/19-distribution-and-lookup.md §6, §8; crates/trigon-attest/src/log/files.rs; crates/trigon-attest/tests/evidence_repo/
- id: trigon publish
  component: multiple
  parameters:
  - name: 'the evidence repository it fetches: keys/, log/, records/, evidence/, index/, kill-switch'
    attacker_controllable: true
    control_kinds:
    - data
    - size
    - object-topology
    - resource-name
    caller_must_enforce: 'nothing — P34: keys/log.vkey must name [publish] origin; a branch that names
      git attributes is refused before it is checked out; the log is verified whole under it, and against
      the newest checkpoint of the log this host has published or verified, whatever store or spelling
      of the location, before anything is built on it; nothing past the checkpoint is read; a file at
      a path a publication writes is replaced, never written through, and a link where it writes a directory,
      or planted as index, is refused; its .gitignore changes nothing committed'
    provenance:
      kind: documented
      source: docs/19-distribution-and-lookup.md §2.4, §8, §10 phase 5; crates/trigon/tests/publish.rs
- id: trigon log sign
  component: multiple
  parameters:
  - name: the tree it is handed
    attacker_controllable: true
    control_kinds:
    - data
    - size
    - object-topology
    caller_must_enforce: 'nothing — P35: it signs only a tree extending a checkpoint its own key opens
      and the newest checkpoint of the log published from this host, whose every new leaf names a record
      every client would accept, and reads nothing past the size it is told to sign; the checkpoint it
      writes is renamed over the old from a file made new, never written through a link'
    provenance:
      kind: documented
      source: crates/trigon-attest/src/evidence/sign.rs; crates/trigon-attest/tests/evidence_repo/sign.rs
