      kind: documented
      source: docs/12-security.md §8
- id: evidence sources — the configuration is read (trigon_attest::config, docs/19 §10 phase 2); syncing
    is phase 6
  component: multiple
  parameters:
  - name: a project's .trigon/evidence.toml, read from the working directory
    attacker_controllable: true
    control_kinds:
    - data
    - resource-name
    - x-git-remote-url
    caller_must_enforce: nothing; Trigon holds the file to less than the user's own configuration. It
      may only add [[source]] entries, each under a new name, with both keys and an initial checkpoint
      pinned and HTTPS URLs only, and any file it names — a PEM key, the checkpoint — must be inside the
      working directory once symlinks are followed, as must the file itself, which is also a regular file
      of at most 64 KiB; a file that tries anything else is refused whole, with the rule it broke and
      its strings escaped, and a parse error gives a line and column without quoting the file; and every
      answer from such a source names the file that added it. It can add a claim and cannot change what
      any other source answers
    provenance:
      kind: documented
      source: docs/19-distribution-and-lookup.md §2.4, §8; crates/trigon-attest/tests/evidence_config.rs
        — `a_project_file_that_breaks_a_rule_is_refused_whole_with_the_rule`, `a_project_file_that_links_outside_the_project_is_not_read`
