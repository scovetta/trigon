properties_claimed:
- id: P1
  kind: memory-safety
  components:
  - archive-parsing
  - comparison-and-verdict
  - stabilization
  tier: security-critical
  conditions: any input bytes
  violation_symptoms:
  - panic, hang, wrong digest
  statement: Parsing a hostile artifact does not panic, escape its enforced limits — recursion, total
    expansion and entry count, but not the two D23 records as dead — or silently change a digest. Recursion
    is bounded by Limits::recursion, whose default of 4 descends three levels below the top — N parses
    N-1, stricter than the name reads — and a parse failure keeps the member inline and emits NestedParseFailed.
  provenance:
    kind: documented
    source: docs/05 §2.2; crates/trigon-archive/src/zip.rs — `checked_add`; crates/trigon-archive/src/gzip.rs:25
      — the output budget; tests `an_offset_that_wraps_is_a_short_read_and_not_a_panic`, `a_gzip_bomb_is_refused_at_the_limit_rather_than_inflated`,
      `a_zip_member_that_lies_about_its_size_is_refused`
- id: P2
  kind: correctness
  components:
  - archive-parsing
  tier: security-critical
  conditions: same stabilizer set
  violation_symptoms:
  - two runs disagree on a digest
  statement: 'The stabilized form is a byte-stable function of the input: parse(write(a)) == a, identical
    across runs and threads of a single process'
  provenance:
    kind: documented
    source: docs/13-roadmap.md M0
- id: P3
  kind: correctness
  components:
  - stabilization
  tier: security-critical
  conditions: —
  violation_symptoms:
  - a digest that depends on how many times a pass ran
  statement: 'Stabilizers are total and idempotent: stab(stab(x)) == stab(x), no Result, no half-stabilized
    state, and none allocates more than one member at a time'
  provenance:
    kind: documented
    source: docs/05 §4
- id: P4
  kind: integrity
  components:
  - comparison-and-verdict
  tier: security-critical
  conditions: —
  violation_symptoms:
  - a verdict derived across incomparable sets
  statement: compare refuses to compare two sides stabilized under different sets, by set digest, and
    classifies the refusal Fault::Bug
  provenance:
    kind: documented
    source: docs/09-attestations.md §7
- id: P5
  kind: integrity
  components:
  - multiple
  tier: security-critical
  conditions: —
  violation_symptoms:
  - a model- or human-authored normalization reported as clean
  statement: Provenance-capped outcomes. normalized is produced only when the stabilized digests are equal
    and every applied stabilizer is Builtin with risk ≤ Metadata. Anything else that matches is normalized_with_caveats
  provenance:
    kind: documented
    source: docs/00-overview.md §3.1; crates/trigon-compare/src/lib.rs:166-181
- id: P6
  kind: integrity
  components:
  - attestation
  tier: security-critical
  conditions: the run was recorded, and the facts that void it are on its record
  violation_symptoms:
  - a signed equivalence or divergence about a run that fetched its own answer or had the whole network
  - a void/v1 that says which way the comparison went
  statement: 'No path signs a verdict for a void run; it is signed as void/v1 and only that, by trigon
    attest and by trigon rebuild --attest, which signs through the same code (sign_run). A void run is
    one the publication gate calls void (trigon_api::publication::voided, which is decide''s own answer):
    its guard tripped, whether or not it reached an outcome, or it reached an outcome at open egress or
    with a stab'
  provenance:
    kind: documented
    source: docs/19-distribution-and-lookup.md §4.3; docs/16-findings.md §3.96, §3.97; crates/trigon/tests/seam_attest_v2.rs
      — `a_guard_tripped_run_yields_void_v1_and_never_a_verdict`, `an_open_egress_run_yields_void_too`,
      `a_run_a_hand_written_stabilizer_applied_to_is_signed_as_void_and_only_void`, `a_verdict_is_not_signed_for_a_record_that_hides_a_hand_written_stabilizer`;
      crates/trigon/src/main.rs — `rebuild_attest_at_open_egress_signs_void_and_never_a_verdict`
- id: P7
  kind: integrity
  components:
  - multiple
  tier: security-critical
  conditions: every provider except copilot:, which has no system-role channel
  violation_symptoms:
  - a build log rewriting the operator's instructions
  statement: Text reaching a model is bounded and control-stripped, and operator instructions travel in
    a system message, never spliced into package text
  provenance:
    kind: documented
    source: docs/12-security.md §4.1; crates/trigon-ai/src/copilot.rs:35
- id: P8
  kind: integrity
  components:
  - multiple
  tier: security-critical
  conditions: —
  violation_symptoms:
  - an asymmetric normalization producing a false match
  statement: Both artifacts receive an identical transform; the API has no way to stabilize one side differently.
    Enforced by the type signature
  provenance:
    kind: documented
    source: docs/12-security.md §10
- id: P9
  kind: integrity
  components:
  - attestation
  tier: security-critical
  conditions: signing path
  violation_symptoms:
  - two implementations disagreeing on what was signed
  statement: 'Canonical JSON refuses what another implementation might not reproduce: floats and non-ASCII
    object keys are type errors, not coerced values'
  provenance:
    kind: documented
    source: crates/trigon-core/src/jcs.rs
- id: P10
  kind: integrity
  components:
  - registry-and-source
  tier: security-critical
  conditions: —
  violation_symptoms:
  - command or option injection from registry metadata
  statement: A package-declared repository reaches git as https only, with a 40-hex commit only, under
    GIT_CONFIG_NOSYSTEM and a restricted GIT_ALLOW_PROTOCOL. Only the operator may name a local path
  provenance:
    kind: documented
    source: docs/16-findings.md §3.7
- id: P11
  kind: integrity
  components:
  - build-execution
  tier: security-critical
  conditions: podman honours its flags
  violation_symptoms:
  - a run recorded as enforced that was not
  - a derivation that happened and was not recorded
  statement: 'A runner refuses an egress tier it cannot enforce rather than downgrading it, and at every
    tier but open no phase of the run reaches the network — the image build takes --network none too,
    and so does the probe that asks an image what it carries. The one exception is --image derive, which
    builds a base image with network before the build: it is opt-in, never reached by auto, recorded on
    the run as'
  provenance:
    kind: documented
    source: docs/16-findings.md §3.13, §3.69
- id: P12
  kind: integrity
  components:
  - multiple
  tier: security-critical
  conditions: an enforced tier
  violation_symptoms:
  - the forged-attestation attack succeeding
  statement: The mirror refuses to serve this run's own published artifact, and hashes every proxied body
    as it streams; a whole-artifact or member match voids the run. Artifact bodies are proxied undecoded
    so the guard sees real bytes
  provenance:
    kind: documented
    source: docs/12-security.md §2.1–2.2
- id: P13
  kind: integrity
  components:
  - multiple
  tier: security-critical
  conditions: —
  violation_symptoms:
  - the mirror acting as a general HTTP proxy
  statement: Both mirror passthrough routes proxy only to compiled-in, exact-match host allowlists chosen
    here rather than by the request
  provenance:
    kind: documented
    source: docs/16-findings.md §3.13
- id: P14
  kind: integrity
  components:
  - multiple
  tier: security-critical
  conditions: —
  violation_symptoms:
  - any host file becoming the "rebuilt artifact"
  statement: The output collector takes a file's type without following symlinks
  provenance:
    kind: documented
    source: docs/16-findings.md §3.12; crates/trigon-sandbox/src/podman.rs:691
- id: P15
  kind: integrity
  components:
  - multiple
  tier: security-critical
  conditions: —
  violation_symptoms:
  - a strategy widening its own boundary
  statement: A strategy cannot request privileged execution, a wider egress tier, an unpinned base image,
    or a platform
  provenance:
    kind: documented
    source: docs/04-strategies.md
- id: P16
  kind: confidentiality
  components:
  - multiple
  tier: security-critical
  conditions: —
  violation_symptoms:
  - a key in a process list or shell history
  statement: Model API keys are read from the environment and never accepted on the command line
  provenance:
    kind: documented
    source: crates/trigon/src/inferrer.rs:527
- id: P17
  kind: output-sanitization
  components:
  - multiple
  tier: security-critical
  conditions: —
  violation_symptoms:
  - script execution in the operator's browser
  - path traversal
  statement: Every package-derived string trigon watch renders is HTML-escaped, and the only path parameter
    is an integer, re-formatted rather than joined
  provenance:
    kind: documented
    source: crates/trigon/src/watch.rs — `esc`
- id: P18
  kind: integrity
  components:
  - model-inference
  tier: security-critical
  conditions: —
  violation_symptoms:
  - a silent model call
  - a changed question answered from an old recording
  statement: 'A model is never called unless --model names a provider; replay: opens no socket; a replay
    refuses a prompt differing from the recorded one; a transcript naming an alias rather than a snapshot
    is refused for replay'
  provenance:
    kind: documented
    source: docs/07-ai.md §8
- id: P19
  kind: correctness
  components:
  - multiple
  tier: correctness-only
  conditions: —
  violation_symptoms:
  - a false divergence from reordering
  statement: Members are paired by (path, occurrence), never by archive position
