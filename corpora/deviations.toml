# Deviations from the reference implementation.
#
# The M0 differential test asserts stabilized-digest equality against google/oss-rebuild's
# `cmd/stabilize` for every corpus artifact, EXCEPT the deviations listed here. An unexplained
# difference fails the build. Every entry carries a test and a sentence, and adding one is a
# reviewed change rather than a way to make a red build green.
#
# `signature` names the difference codes a deviation explains, as patterns where `*` matches any
# run of characters. Attribution is by what the difference IS, not by which file it turned up in.
# A list of filenames grows with every corpus and is trivial to extend without thinking, so a real
# bug in one wheel hides the moment some other wheel is exempt. A pattern cannot hide one: a wheel
# that differs in a field no deviation claims stays unexplained, however many wheels are covered.
#
# An entry with no patterns makes no claim about the corpus. It records a writer property pinned by
# the test it names, and is exempt from the stale check for that reason.
#
# `xtask differential` prints the codes it could not attribute, grouped by class with counts, which
# is what these patterns are written from. Run it and read the report.
#
# See docs/05-archive-and-normalization.md §6.

schema = 1

[[deviation]]
id = "zip-writer-defaults"
signature = [
  "entry:zip.creator_version@*",
  "entry:zip.reader_version@*",
  "entry:zip.flags@*",
  "entry:zip.extra@*",
  "entry:zip.dos_datetime@*",
  "entry:mtime@*",
]
applies_to = ["zip"]
test = "crates/trigon-archive/tests/zip_roundtrip.rs::stored_output_carries_no_compression"
summary = "We zero the zip fields their writer leaves at its own defaults."
detail = """
The reference's stabilized wheel carries version-made-by 20, version-needed 20, the data-descriptor
flag, and a 0x5455 extended-timestamp extra field, none of which its stabilizers ask for. They are
Go's archive/zip writer defaults. Its DOS date comes out as 31 December 2097, which is what a zero
time.Time degrades to.

We zero all of it: no writer-specific extra field, no descriptor flag we do not use, and no date at
all. That is what a stabilized form should look like, and matching Go here would mean carrying
another language's writer conventions into a digest we sign.
"""

[[deviation]]
id = "cargo-vcs-surgical"
signature = ["body@*/.cargo_vcs_info.json", "entry:size@*/.cargo_vcs_info.json"]
applies_to = ["crate"]
test = "crates/trigon-stabilize/tests/passes.rs::the_crate_profile_is_capped_by_cargo_vcs_hash"
summary = "We replace the sha1 in place; the reference re-serializes the whole JSON."
detail = """
The reference round-trips .cargo_vcs_info.json through a JSON serializer, which compacts whitespace
and normalizes key order along the way: 94 bytes in, 76 bytes out.

We replace the 40 hex characters and touch nothing else, so bytes_changed is 40 and means it. A pass
that reports Content risk should change the bytes it says it changes. Reformatting the file would
also mask a genuine difference in a neighbouring field.
"""

[[deviation]]
id = "nested-parse-errors"
signature = []
applies_to = ["gem", "tar"]
test = "crates/trigon-archive/tests/nested.rs::a_malformed_inner_archive_notes_rather_than_guessing"
summary = "A malformed inner archive produces a note here and silence there."
detail = """
The reference implements gem inner-archive recursion as a stabilizer and discards the error, so a
malformed data.tar.gz yields a different stabilized digest with no signal. We leave the body
unparsed and emit NoteCode::NestedParseFailed. Digests therefore differ for any artifact with an
inner archive we cannot read, and ours says so.
"""

[[deviation]]
id = "duplicate-path-ordering"
signature = []
applies_to = ["tar", "zip"]
test = "crates/trigon-archive/tests/tar_roundtrip.rs::duplicate_paths_are_noted_and_ordering_is_total"
summary = "Our sort key is (path, ordinal); theirs is path alone."
detail = """
Both formats permit duplicate member paths. Sorting by path alone is not a total order over a
multiset, so an archive with duplicates can serialize two ways. We break ties on parse order and emit
a note. Any artifact with duplicate paths can therefore order differently from the reference, and
only one of the two orderings is reproducible.
"""

[[deviation]]
id = "long-names-always-pax"
signature = []
applies_to = ["tar"]
test = "crates/trigon-archive/tests/tar_roundtrip.rs::long_names_are_re_encoded_as_pax"
summary = "We never use the ustar prefix field: every long name takes a PAX path record."
detail = """
A name over 100 bytes can be carried three ways: a GNU L-typeflag entry, a PAX path record, or the
ustar prefix field joined to the name with a '/'. The prefix only works when a '/' falls in the right
place, so it makes the framing a property of where the slashes are rather than of the length, and two
paths of the same length are encoded differently.

We always emit PAX, with records ordered by keyword, and leave the prefix field NUL. A writer pinned
to the PAX format does the same, so this agrees with the reference. It is listed here because it is a
writer property worth pinning with a test, not because the digests differ.
"""

[[deviation]]
id = "pyc-source-mtime"
signature = [
  "body@*.pyc",
  "entry:zip.crc32@*.pyc",
  "body@*.dist-info/RECORD",
  "entry:zip.crc32@*.dist-info/RECORD",
]
applies_to = ["wheel"]
test = "crates/trigon-stabilize/tests/pyc_header.rs"
summary = "We zero the source mtime embedded in a timestamp-validated .pyc; the reference has no .pyc pass."
detail = """
A PEP 552 header is 16 bytes: magic, a flags word, and 8 bytes whose meaning bit 0 of the flags
selects. With the bit clear those are the source mtime and the source size. The mtime is the mtime
of the .py file on the machine that compiled it, so two builds of identical source from different
checkouts produce different .pyc bytes. That is exactly the nondeterminism a stabilizer removes, and
the reference's stabilizer list for wheels has nothing that touches a .pyc.

We zero the four mtime bytes and nothing else. Not the magic, which identifies the bytecode version.
Not the flags, which say how to read the rest. Not the source size or the source hash, which are
derived from the source and cannot differ while it matches.

RECORD is listed here too, and the reason is a chain rather than a second decision: RECORD is a
manifest of sha256 over the members, so any member whose bytes we change shows up there. That does
make the RECORD patterns broader than the .pyc ones, and a RECORD-only difference from some other
cause would be absorbed by them. The narrower alternative is to compare RECORD against the members
it describes rather than against the reference, which belongs with the wheel-record pass rather than
here.
"""

[[deviation]]
id = "gem-metadata-yaml"
signature = ["body@metadata.gz!payload", "entry:size@metadata.gz", "entry:size@metadata.gz!payload"]
applies_to = ["gem"]
test = "crates/trigon-stabilize/tests/gem_metadata.rs"
summary = "We normalize the three gemspec fields that carry build noise; the reference also reformats the document."
detail = """
gem-metadata-date, gem-metadata-rubygems-version and gem-metadata-cert-chain are implemented and
match the reference's substitutions exactly: the same replacement date, the same 0.0.0, the same
empty cert chain.

gem-metadata-yaml-normalize is not, and will not be. It round-trips the whole gemspec through a YAML
serializer, which re-indents every list and drops the document marker. Our metadata.gz has the same
120 lines as theirs and differs on 78 of them for that reason alone.

This is the cargo-vcs-surgical argument again. A pass that reports Metadata risk should change the
fields it says it changes. Reformatting the surrounding document inflates bytes_changed into
meaninglessness and would mask a genuine difference in a neighbouring field.
"""

[[deviation]]
id = "wheel-metadata-eol"
signature = [
  "body@*.dist-info/METADATA",
  "entry:size@*.dist-info/METADATA",
  "entry:zip.crc32@*.dist-info/METADATA",
  "body@*.dist-info/WHEEL",
  "entry:size@*.dist-info/WHEEL",
  "entry:zip.crc32@*.dist-info/WHEEL",
  "body@*.dist-info/entry_points.txt",
  "entry:size@*.dist-info/entry_points.txt",
  "entry:zip.crc32@*.dist-info/entry_points.txt",
  "body@*.dist-info/top_level.txt",
  "entry:size@*.dist-info/top_level.txt",
  "entry:zip.crc32@*.dist-info/top_level.txt",
  "body@*.dist-info/RECORD",
  "entry:size@*.dist-info/RECORD",
  "entry:zip.crc32@*.dist-info/RECORD",
]
applies_to = ["wheel"]
test = "crates/trigon-stabilize/tests/passes.rs::two_wheels_differing_only_in_metadata_line_endings_agree_after_stabilizing"
summary = "We normalize CRLF to LF in the metadata a wheel builder generates; the reference does not."
detail = """
A publisher on Windows gets CRLF in METADATA because the tool that wrote it opened the file in text
mode, and the same tool on Linux writes LF. The content is identical — these are RFC 822-style
headers, where a line terminator carries no meaning — but the bytes are not, and RECORD differs too
because it digests METADATA. We cannot reproduce Windows text-mode I/O from a Linux builder, so
normalizing is the only route to a match, and without it every package published from Windows is
permanently divergent for a reason that says nothing about its source.

The corpus makes the case and also bounds it. Two of 58 M0 artifacts are affected, one of which is
named `feagi_bv_windows`; one of 17 in the M1 PyPI corpus. Adding the pass flipped `sniffio 1.3.1`
from divergent to reproducing and changed no other verdict in either corpus.

Scoped to the four files a wheel builder *generates*, never to package source. A `.py` file with
CRLF is the package's own content and its line endings are the author's choice; a stabilizer that
rewrote those would be editing the thing under test. `dist-info/` is not a licence to rewrite
everything inside it either — a wheel may ship hand-written files there — so the list is explicit
rather than a glob. Three tests pin exactly that boundary.

RECORD appears in the signature because it is a manifest of digests over the other four; normalizing
them necessarily moves it. It is regenerated at Finalize over the normalized bytes.
"""
