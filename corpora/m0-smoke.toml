schema = 1
name = "m0-smoke"
description = """
A five-artifact smoke corpus for the differential test. Small enough to fetch in seconds and wide
enough to cover every container shape M0 handles: npm tar+gzip, a crate, a wheel, and a gem with
nested archives. The full M0 corpus stratified by structure is specified in docs/15-corpora.md §2.
"""
created = "2026-09-10"

[provenance]
method = "hand-picked, one per container shape"
source = "the ecosystems' own registries"
script = "xtask/src/corpus.rs"

