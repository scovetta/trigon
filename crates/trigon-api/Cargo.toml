[package]
name = "trigon-api"
version = "0.0.0"
description = "The read path a decoupled front-end talks to: verdicts, runs, and class-gated evidence."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
trigon-core.workspace = true
trigon-store = { workspace = true, features = ["queue"] }
trigon-attest.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
futures.workspace = true

[dev-dependencies]
# A store with a real run in it, so the HTTP tests serve a record that went through `put_run`
# rather than one hand-built in memory.
tokio = { workspace = true }
# Calling the router directly, so the tests exercise the real handlers rather than a copy of their
# logic. `axum` already depends on it; naming it here is what makes `Service::call` reachable.
tower-service = "0.3"
tempfile.workspace = true
# Building a real `Comparison` to assert the projection in `comparison.rs` reads it. A
# **dev**-dependency on purpose: `the_comparator_is_not_even_a_dependency` scopes itself to
# `[dependencies]`, because a crate linked into tests cannot be reached by a handler.
trigon-compare.workspace = true
trigon-stabilize.workspace = true
trigon-archive.workspace = true
zip.workspace = true
