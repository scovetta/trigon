[package]
name = "trigon-registry"
version = "0.0.0"
description = "Reading the internet about a package: resolution, artifacts, source discovery."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
trigon-core.workspace = true
trigon-politeness.workspace = true
trigon-strategy.workspace = true
# For reading what a published wheel says about the toolchain that made it.
trigon-archive.workspace = true
serde.workspace = true
serde_json.workspace = true
# Workflow files. `serde_yaml_ng` is the maintained fork of the archived `serde_yaml`, and is
# already the workspace's YAML parser for strategy documents.
serde_yaml_ng.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
# Verifying what a registry declares: npm's `shasum` is sha1 and PyPI declares md5 beside sha256.
sha1.workspace = true
md-5.workspace = true
tokio.workspace = true
async-trait.workspace = true
reqwest.workspace = true

[dev-dependencies]
sha2.workspace = true
tokio = { workspace = true, features = ["test-util"] }
zip = { workspace = true }
tempfile.workspace = true
