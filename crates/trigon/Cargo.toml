[package]
name = "trigon"
version = "0.0.0"
description = "Semantic rebuild verification for open-source packages."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "trigon"

[[bin]]
name = "trigon"
path = "src/main.rs"

[dependencies]
trigon-core.workspace = true
trigon-archive.workspace = true
trigon-stabilize.workspace = true
trigon-compare.workspace = true
trigon-strategy.workspace = true
trigon-sandbox = { workspace = true, optional = true }
trigon-registry = { workspace = true, optional = true }
trigon-mirror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true

[features]
# On by default, so `cargo install trigon` gives a tool that can build.
default = ["build"]
# Everything that needs an async runtime. `--no-default-features` produces the verifier: a binary
# that reproduces a verdict from two artifacts and links no runtime and no network client, which is
# the claim a sceptic can check with `cargo tree` rather than take on trust.
build = ["dep:trigon-sandbox", "dep:trigon-registry", "dep:trigon-mirror", "dep:tokio"]

[dev-dependencies]
tar = "0.4"
zip_crate = { package = "zip", version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
