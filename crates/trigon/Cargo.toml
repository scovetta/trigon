[package]
name = "trigon"
version = "0.0.0"
description = "Semantic rebuild verification for open-source packages."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "trigon"

[[bin]]
name = "trigon"
path = "src/main.rs"

[dependencies]
trigon-core.workspace = true
trigon-archive.workspace = true
trigon-stabilize.workspace = true
trigon-compare.workspace = true
trigon-strategy.workspace = true
trigon-attest.workspace = true
trigon-sandbox = { workspace = true, optional = true }
trigon-registry = { workspace = true, optional = true }
trigon-mirror = { workspace = true, optional = true }
trigon-store = { workspace = true, optional = true }
trigon-ai = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
trigon-stabilize-wasm = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# On by default, so `cargo install trigon` gives a tool that can build.
default = ["build"]
# Everything that needs an async runtime. `--no-default-features` produces the verifier: a binary
# that reproduces a verdict from two artifacts and links no runtime and no network client, which is
# the claim a sceptic can check with `cargo tree` rather than take on trust.
build = ["dep:trigon-sandbox", "dep:trigon-registry", "dep:trigon-mirror", "dep:trigon-store", "dep:trigon-ai", "dep:tokio", "dep:async-trait", "dep:axum"]
# Run an archived stabilizer set rather than only describing it, so a claim made under a set this
# binary does not carry can still be re-derived. Off by default: it roughly doubles the verifier's
# dependency tree, and the small tree is the thing a sceptic checks instead of trusting us. A
# verifier who only ever checks claims made under their own set never needs it.
wasm = ["dep:trigon-stabilize-wasm", "trigon-stabilize-wasm/host"]

[dev-dependencies]
tar = "0.4"
zip_crate = { package = "zip", version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
base64.workspace = true
