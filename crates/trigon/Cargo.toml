[package]
name = "trigon"
version = "0.0.0"
description = "Semantic rebuild verification for open-source packages."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "trigon"

[[bin]]
name = "trigon"
path = "src/main.rs"

[build-dependencies]
# Shared with the binary through `include!("src/mirror_source.rs")`, so the digest the mirror
# image is labelled with and the digest the staleness check compares come from one function.
sha2.workspace = true

[dependencies]
libc = "0.2"
trigon-core.workspace = true
trigon-archive.workspace = true
trigon-stabilize.workspace = true
trigon-compare.workspace = true
trigon-strategy.workspace = true
trigon-attest.workspace = true
trigon-politeness = { workspace = true, optional = true }
trigon-sandbox = { workspace = true, optional = true }
trigon-registry = { workspace = true, optional = true }
# Release assets (`publish` uploads them, `verify-attestation --lookup` downloads one) and `lookup
# --remote` (docs/19 §10 phases 5 and 6): the HTTP client the workspace already links, so neither
# adds a second. Optional and behind `build` for the reason everything else here is: the verifier
# is the `--no-default-features` build and its whole claim is that it links no network client.
reqwest = { workspace = true, optional = true }
trigon-mirror = { workspace = true, optional = true }
trigon-store = { workspace = true, optional = true }
trigon-api = { workspace = true, optional = true }
trigon-engine = { workspace = true, optional = true }
trigon-ai = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
trigon-stabilize-wasm = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
anyhow.workspace = true
# The divergence feed names each record by an RFC 6920 `ni:` URI, which is base64url. Already in
# the tree through trigon-attest.
base64.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# On by default, so `cargo install trigon` gives a tool that can build.
default = ["build"]
# Everything that needs an async runtime. `--no-default-features` produces the verifier: a binary
# that reproduces a verdict from two artifacts and links no runtime and no network client, which is
# the claim a sceptic can check with `cargo tree` rather than take on trust.
#
# `wasm` with it: `attest` runs the stabilizer-set module it names in a verdict before it signs, and
# `publish` refuses a verdict that names none, so the build that signs and publishes runs modules.
build = ["dep:trigon-politeness", "dep:trigon-sandbox", "dep:trigon-registry", "dep:trigon-mirror", "dep:trigon-store", "dep:trigon-api", "dep:trigon-engine", "dep:trigon-ai", "dep:tokio", "dep:async-trait", "dep:axum", "dep:reqwest", "wasm"]
# Run an archived stabilizer set rather than only describing it, so a claim made under a set this
# binary does not carry can still be re-derived. Part of `build`; off in the verifier
# (`--no-default-features`) unless asked for with `--features wasm`: it takes the verifier's
# dependency tree from 109 crates to 154 (wasmtime 49), and needs Rust 1.96 where the rest declares
# 1.85. The small tree is the thing a sceptic checks instead of trusting us, and a verifier who only
# ever checks claims made under their own set never needs it.
wasm = ["dep:trigon-stabilize-wasm", "trigon-stabilize-wasm/host"]

[dev-dependencies]
tar = "0.4"
# A store with a real run in it, compared from artifact bytes rather than hand-written, for the
# tests that read what `trigon runs` prints about it.
trigon-store.workspace = true
trigon-compare.workspace = true
trigon-archive.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
zip_crate = { package = "zip", version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
# The divergence feed is tested by parsing it as XML, with a parser that knows nothing of how it
# was written.
roxmltree = "0.20"
