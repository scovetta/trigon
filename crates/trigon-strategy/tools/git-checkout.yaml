# Fetch the working tree at a pinned commit.
#
# `--force` because the image may carry a tree from a cached layer, and a checkout that quietly
# fails leaves the previous revision in place. That is a rebuild of the wrong commit reported as a
# rebuild of the right one.
id: git-checkout
# `ca-certificates` as well as git. A slim base image carries no CA bundle, so cloning over HTTPS
# fails with "server certificate verification failed. CAfile: none", which reads like a network
# problem rather than a missing package. It went unnoticed for a while because installing npm pulls
# a CA bundle in as a dependency, so every npm target happened to work.
needs: [git, ca-certificates]
params:
  crlf:
    required: false
    doc: >-
      Set core.autocrlf on clone. For packages published from a Windows working tree, where the
      line endings in the artifact came from the checkout rather than from the repository.
steps:
  - runs: |
      {%- if not env.has_repo %}
      git clone {% if with.crlf == "true" %}-c core.autocrlf=true {% endif %}{{ location.repo }} .
      {%- endif %}
      git checkout --force '{{ location.ref }}'
