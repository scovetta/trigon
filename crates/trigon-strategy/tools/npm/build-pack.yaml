# The plain case: set the version if asked, then pack.
id: npm/build/pack
params:
  registry_time:
    required: false
    doc: >-
      Passed to `npm/npx`, which exports it before anything runs. The build phase calls npx too, so
      without it a build whose pinned npm differs from the image's downloads that npm from the
      default registry — the same failure the deps phase had, one phase later.
  npm_version:
    required: true
  version_override:
    required: false
  locator:
    required: false
    default: /usr/local/bin/
    doc: >-
      Where to find npx. Defaults to where npm/install-node puts it. The prior art hardcodes
      /usr/bin here because its base image ships npm there; on an image where the toolchain was
      installed rather than preinstalled, that resolves the system npm against the installed node
      and fails with a module the older runtime does not have.
steps:
  - uses: npm/version-override
    with:
      version: "{{ with.version_override }}"
      dir: "{{ location.subdir }}"
  - uses: npm/npx
    with:
      registry_time: "{{ with.registry_time }}"
      command: npm pack
      npm_version: "{{ with.npm_version }}"
      dir: "{{ location.subdir }}"
      locator: "{{ with.locator }}"
