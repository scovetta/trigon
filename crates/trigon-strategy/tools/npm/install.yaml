# Install dependencies against the mirror.
#
# `--force` because a rebuild resolves a tree that was valid on the publish date and may violate a
# peer-dependency constraint that tightened since. `--no-audit` because the audit endpoint is a
# network call that changes nothing about the output.
id: npm/install
params:
  npm_version:
    required: true
  registry_time:
    required: false
  locator:
    required: false
steps:
  - uses: npm/npx
    with:
      # The registry is set by `npm/npx` for the whole script now, so it covers npx's own
      # `--package` download as well as this command. Prefixing it here too would be a second
      # place that has to agree with the first.
      command: "npm install --force --no-audit"
      registry_time: "{{ with.registry_time }}"
      npm_version: "{{ with.npm_version }}"
      dir: "{{ location.subdir }}"
      locator: "{{ with.locator }}"
