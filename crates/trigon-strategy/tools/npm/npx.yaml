# Run a command under a specific npm, in the package directory.
#
# **`npx` did not always exist, and the pinned toolchain is often older than it.** npx ships with
# npm 5.2.0, July 2017. A package published before that pins an npm that has no npx at all — and the
# fallback below reached for it on exactly those targets. `once@1.4.0` pins npm 3.10.7 on Node 6.5.0,
# whose bundled npm is 3.10.3; the versions differ, so the fallback ran, and the deps phase died with
# `/usr/local/bin/npx: not found` on a toolchain from 2016 being driven by a command from 2017.
#
# So there are three cases, not two: the bundled npm is already the one we want; npx exists and can
# fetch the one we want; or neither, and the bundled npm installs the pinned npm over itself. The
# last is what a publisher in 2016 would have done, and it is faithful — the npm that runs the build
# is still the one the registry says published the package.
#
# **The tempting wrong fix is to put npx in the base image.** It would make this failure disappear
# and would run a 2016 package's build under a modern npm, discarding the version pin that is the
# point of the exercise. A verdict that reproduces under the wrong toolchain is worth less than a
# failure that says so.
#
# The bundled npm first. Every Node distribution ships one, and when it is already the version we
# want, `npx --package=npm@X` re-downloads and re-unpacks the same npm for nothing. That is not
# only waste: npm 5.5.1 on Node 9.2.1, which is exactly what published left-pad 1.3.0, aborts in
# node-tar while unpacking itself, so the faithful reproduction of a 2018 publish fails on a step
# the publisher never ran. The bundled copy is already unpacked and works.
#
# The command is carried in a variable so it is quoted once. It must not contain a single quote;
# nothing that generates one here does, and a tool that needs it should say so rather than have
# this silently mangle it.
#
# **Do not add `needs: [npm]` back at tool level.** Debian's `npm` package pulls in its own Node —
# 18 on bookworm — plus a tree under `/usr/share/nodejs` that a system-wide `NODE_PATH` puts ahead
# of everything. A pinned Node 10 then loads modules written for 18 and aborts with SIGABRT after
# the install has already succeeded, which reads as a toolchain too old for the kernel and is not:
# the same build passes with the identical Node and npm when that one apt package is absent.
# `env/toolchain-crashed` on the M1 corpus was this, not vintage.
#
# When a `locator` is given the caller has already installed the Node it wants, so the need belongs
# on the fallback branch alone — and a skipped step contributes no needs.
#
# `unsafe-perm` is about our sandbox, not about the package. npm 5 and 6 running as root try to drop
# privileges with `setuid` before running lifecycle scripts, and a rootless container with
# `no-new-privileges` denies that: npm reports `EPERM` from `uid-number`, then crashes inside its own
# error handler and reports nothing useful. The deps phase escapes it because image-build time has
# the capability and `podman run` does not, so the same strategy worked in one phase and not the
# next. Running as root in a disposable container is the intent, and the tar stabilizer zeroes
# ownership either way.
# **The registry has to be set for `npx` itself, not only for the command it runs.** `npx
# --package=npm@6.1.0` downloads that npm before it runs anything, and that download used the
# default registry — so at `mirror-only` the build fetched Node through the mirror, then went
# straight to `registry.npmjs.org` for npm and died with `ENETUNREACH`. Setting it inside the
# command string configured the *inner* npm and not the fetch that has to happen first.
#
# Exported once at the top of the script, so npx's own download and everything it then runs inherit
# it. Third instance of this shape in a day: a step that configures the mirror running after a step
# that needs it.
#
# **npm 7.0 through 8.2 corrupts the tarballs it fetches concurrently, and it reads as a broken
# mirror.** Six targets in the npm sweep died with `zlib: invalid distance too far back` and its
# relatives; every one of them pinned an npm in that range and no target outside it did, across four
# different Node versions. The mirror was innocent, and provably: its transcript recorded complete
# bodies whose SHA-256 equalled the upstream tarball byte for byte, 120 concurrent fetches through
# it all verified, and a second unrelated server — written in Python, buffering whole bodies behind
# a `Content-Length`, logging a completed write for every one of 112 requests — reproduced the same
# corruption. npm 8.3.0 is the first release that does not, on the same Node, against the same
# mirror, minutes apart.
#
# What the errors say is that a body which started out valid stops being valid partway in, with no
# integrity failure anywhere in the log. That is a stream spliced inside the client, not an artifact
# that was ever wrong on the wire — and taking npm's concurrency away removes it at every affected
# version tested.
#
# It does not fire against registry.npmjs.org, which is how the bug outlived those releases: that
# CDN's timing happens to miss the window and ours lands in it. Nothing we can serve avoids it —
# `Content-Length`, `Connection: close` and a warm, fast cache each only moved the count around.
#
# Serializing fetches makes those builds slower and only those: the range is closed behind us, so
# nothing newer than December 2021 pays for it. A fetch-concurrency knob cannot change which
# versions resolve or which bytes get built, so this is a statement about our sandbox in exactly the
# sense `unsafe-perm` above is.
id: npm/npx
params:
  registry_time:
    required: false
    doc: >-
      The instant to pin the registry to. Exported as `npm_config_registry` before anything runs, so
      npx's own `--package` download is time-warped too. Empty leaves the registry alone, which is
      what `--egress open` without `--timewarp` wants.
  command:
    required: true
  npm_version:
    required: true
  dir:
    required: false
  locator:
    required: false
steps:
  # Two branches for one script, because `needs` is a literal list and the whole point is that one
  # of them must not ask apt for a Node. A skipped step contributes no needs, so the condition is
  # what keeps Debian's nodejs out of an image that already has the one we pinned.
  - runs: |
      export npm_config_unsafe_perm=true
      case "{{ with.npm_version }}" in
        7.*|8.0.*|8.1.*|8.2.*) export npm_config_maxsockets=1 ;;
      esac
      {%- if with.registry_time %}
      export npm_config_registry={{ timewarp_url('npm', with.registry_time) }}
      {%- endif %}
      TRIGON_NPM_CMD='{% if with.dir and with.dir != '.' %}cd {{ with.dir }} && {% endif %}{{ with.command }}'
      if [ "$({{ with.locator }}npm --version 2>/dev/null)" = "{{ with.npm_version }}" ]; then
        sh -c "$TRIGON_NPM_CMD"
      elif command -v {{ with.locator }}npx >/dev/null 2>&1; then
        {{ with.locator }}npx --package=npm@{{ with.npm_version }} -c "$TRIGON_NPM_CMD"
      else
        {{ with.locator }}npm install -g npm@{{ with.npm_version }}
        sh -c "$TRIGON_NPM_CMD"
      fi
    if: "{{ with.locator }}"
  - runs: |
      export npm_config_unsafe_perm=true
      case "{{ with.npm_version }}" in
        7.*|8.0.*|8.1.*|8.2.*) export npm_config_maxsockets=1 ;;
      esac
      {%- if with.registry_time %}
      export npm_config_registry={{ timewarp_url('npm', with.registry_time) }}
      {%- endif %}
      TRIGON_NPM_CMD='{% if with.dir and with.dir != '.' %}cd {{ with.dir }} && {% endif %}{{ with.command }}'
      if [ "$(npm --version 2>/dev/null)" = "{{ with.npm_version }}" ]; then
        sh -c "$TRIGON_NPM_CMD"
      elif command -v npx >/dev/null 2>&1; then
        npx --package=npm@{{ with.npm_version }} -c "$TRIGON_NPM_CMD"
      else
        npm install -g npm@{{ with.npm_version }}
        sh -c "$TRIGON_NPM_CMD"
      fi
    if: "{% if not with.locator %}yes{% endif %}"
    needs: [npm]
