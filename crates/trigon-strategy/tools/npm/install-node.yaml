# Fetch a specific Node build into /usr/local.
#
# Pinned by version, because the toolchain that produced a package is part of what we are
# reproducing and "whatever Node the image has" is not a description of a build.
#
# The libc matters and is not a detail. The prior art hardcodes the musl build because its base
# image is Alpine, and that URL only exists for the versions unofficial-builds covers: Node 9.2.1,
# which is what published left-pad 1.3.0, 404s there while nodejs.org has it. So the variant is a
# parameter, defaulting to the official glibc distribution, which carries every version back to the
# beginning. An Alpine image passes `libc: musl` and accepts the narrower version range that comes
# with it.
# **The download is not piped into tar, and that is the point.** It was
# `wget -O - <url> | tar xzf -`, and a shell pipeline reports the *last* command's status: wget's
# 404 was discarded and the phase died on `gzip: stdin: unexpected end of file` three lines later,
# with wget's own `ERROR 404` scrolled off above it. `set -o pipefail` would fix the status and not
# the message, and it is not POSIX — `/bin/sh` here is dash. So the fetch lands in a file, its exit
# status is checked, and the failure says which version could not be had and from where.
#
# **Only exit 8, and every other failure keeps its own name.** GNU wget — which is what a Debian
# base image carries — exits 8 when the *server* answered with an error, 4 for a network failure, 6
# for auth, and so on. Renaming any non-zero exit would relabel a transient DNS failure inside the
# toolchain fetch, and `net/unreachable` is the honest name for that one. So a server error is named
# and everything else is re-raised untouched, with wget's own message already in the log for the
# classifier to reach.
#
# **`|| TRIGON_WGET=$?`, not a bare command.** Every phase runs under `set -eu`
# (`sandbox/dockerfile.rs`), so a bare failing `wget` exits the shell on the spot and the lines that
# were going to explain it never run. The first version of this fix did exactly that: the phase
# still died on the 404 and printed nothing new. A command on the left of `||` is exempt from
# `-e`, which is what makes the status readable at all.
#
# The case that produced this: `isexe@2.0.0` records `_nodeVersion: 8.0.0-pre`, a string a Node
# built from master reports before 8.0.0 is cut. nodejs.org never published it, so the URL 404s at
# every egress tier — and the run was filed `net/http-error` with `fault: policy`, which points an
# operator at their egress settings for a file that exists nowhere.
#
# **Majors 1 to 3 are io.js and came from a different host under a different name.** For the year
# before the projects merged at 4.0.0, `_nodeVersion` values like `1.6.4` were io.js releases served
# from `iojs.org/dist` as `iojs-v1.6.4-linux-x64.tar.gz`. nodejs.org has no v1, v2 or v3 at all, so
# `delayed-stream@1.0.0` — which records `1.6.4` — asked nodejs.org for a file that was never there.
# This is not a substitution: iojs.org still serves that exact binary, so the build gets the
# toolchain the publisher actually ran rather than a nearby guess. Node 0.x stays on nodejs.org, and
# so does everything from 4.0.0 on, which is why the `case` names three majors and not a range.
#
# A shell `case` rather than a template comparison, for the reason `npm/npx.yaml` gives: the
# boundary is the part that is easy to get wrong, and a glob on a dotted version gets it right where
# a prefix test does not — `1.*` catches `1.6.4` and does not catch `10.9.2`. A test runs this
# `case` under a real `sh`.
#
# `libc: musl` is deliberately not wired up for io.js: unofficial-builds carries no io.js at all, so
# an Alpine image asking for one gets `env/toolchain-unavailable`, which is the true answer.
id: npm/install-node
params:
  node_version:
    required: true
  libc:
    required: false
    default: glibc
    doc: >-
      `glibc` for nodejs.org's official builds, which cover every version. `musl` for
      unofficial-builds, needed on Alpine and available only for newer versions.
steps:
  # The image's own Node first, when it is already the version we want. Mostly to save a 17 MB
  # download; under `mirror-only` egress it also skips a proxy hop, because the download there goes
  # through the mirror's toolchain route — the deps phase runs inside the network island and the
  # mirror is the only host reachable from it. An image that already carries the right toolchain is
  # what `docs/08` §3 means by building base images per ecosystem and toolchain family.
  #
  # `needs: [wget]` on both, not on the tool, because a skipped step contributes nothing. Alpine's
  # busybox provides wget built in, which is why the prior art never had to declare it; a slim
  # Debian image does not, and the failure is `wget: not found` inside a phase that looks like ours.
  - runs: |
      if [ "$(node --version 2>/dev/null)" = "v{{ with.node_version }}" ]; then
        echo "the image already has node v{{ with.node_version }}"
      else
      {%- if with.libc == 'musl' %}
        TRIGON_NODE_URL={{ toolchain_url('unofficial-builds.nodejs.org', 'download/release/v' ~ with.node_version ~ '/node-v' ~ with.node_version ~ '-linux-x64-musl.tar.gz') }}
      {%- else %}
        TRIGON_NODE_URL={{ toolchain_url('nodejs.org', 'dist/v' ~ with.node_version ~ '/node-v' ~ with.node_version ~ '-linux-x64.tar.gz') }}
        case "{{ with.node_version }}" in
          1.*|2.*|3.*) TRIGON_NODE_URL={{ toolchain_url('iojs.org', 'dist/v' ~ with.node_version ~ '/iojs-v' ~ with.node_version ~ '-linux-x64.tar.gz') }} ;;
        esac
      {%- endif %}
        TRIGON_WGET=0
        wget -O /tmp/trigon-node.tar.gz "$TRIGON_NODE_URL" || TRIGON_WGET=$?
        if [ "$TRIGON_WGET" -eq 8 ]; then
          echo "trigon: the pinned Node {{ with.node_version }} is not available at $TRIGON_NODE_URL"
          exit 1
        elif [ "$TRIGON_WGET" -ne 0 ]; then
          exit "$TRIGON_WGET"
        fi
        tar xzf /tmp/trigon-node.tar.gz --no-same-owner --strip-components=1 -C /usr/local/
        rm -f /tmp/trigon-node.tar.gz
      fi
    # `--no-same-owner` because the official tarballs record uid/gid 500, and a deferred deps phase
    # runs inside the container rather than as an image layer: the user namespace there maps a
    # narrow range, so tar fails on every entry and exits non-zero. At `open` egress the same step
    # ran at image-build time and never hit it, which is what made this look like a mirror bug. File
    # ownership inside a toolchain is not part of what we reproduce.
    #
    # `libatomic` because Node 24 and later link against it, and a slim Debian image does not carry
    # it. The failure is `node: error while loading shared libraries: libatomic.so.1` before Node
    # prints anything of its own, so it reads as a broken download rather than a missing package.
    # Declared for every version: it is tens of kilobytes, and a conditional on the Node version
    # would be a second place to get the boundary wrong.
    needs: [wget, libatomic]
