# Point pip at the time-filtered mirror.
#
# Without this, any package with a floating dependency range is unreproducible by construction: the
# rebuild resolves against today's index and the original resolved against the index as it was on
# the publish date. See docs/08-execution.md.
id: pypi/setup-registry
params:
  registry_time:
    required: false
    doc: RFC 3339 moment to filter the index to. Omitted means the live index, which is rarely right.
steps:
  # A config file, not environment variables, for two reasons that each cost a full corpus run:
  #
  # 1. **Phases are separate scripts.** An `export` in the deps phase is gone by the build phase, so
  #    an environment variable pins the index for dependency installation and not for the build —
  #    which is where a PEP 517 frontend creates an isolated environment and installs the build
  #    backend. `sniffio` came back with `Generator: setuptools (84.0.0)` against a mirror pinned to
  #    2024, and every log line said the index was pinned.
  # 2. **pip spawns pip.** `python -m build` runs a fresh pip to populate that isolated environment.
  #    A config file is read by every pip on the machine; an exported variable is inherited only if
  #    nothing in between clears it.
  #
  # `trusted-host` is not optional and its absence is silent: pip treats a plain-HTTP index it does
  # not trust by warning once and then resolving as though no index were configured at all. The only
  # symptom is the mirror reporting zero requests, which reads like a build that happened not to
  # need anything.
  - runs: |
      {%- if with.registry_time %}
      mkdir -p /etc
      cat > /etc/pip.conf <<'TRIGON_PIP_CONF'
      [global]
      index-url = {{ timewarp_url("pypi", with.registry_time) }}/simple
      trusted-host = {{ timewarp_host() }}
      TRIGON_PIP_CONF
      {%- endif %}
