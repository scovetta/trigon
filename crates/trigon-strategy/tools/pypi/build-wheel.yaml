# Build a wheel, or an sdist — whichever the run will be compared against.
#
# Isolation is a parameter because the right answer depends on who is asking. A definition that
# pinned its build requirements exactly wants `-n`: the deps phase already installed them, and
# letting the frontend build its own environment would resolve them again and undo the pinning.
# A heuristic that pinned nothing wants the opposite, because with `-n` the frontend does not
# install a declared build requirement, it checks for it and stops: `six` fails with "Unmet
# dependencies: wheel, found: not installed".
#
# Isolation is not a hole in the pinning when a mirror is in play. The frontend resolves build
# requirements through the same time-filtered index as everything else.
id: pypi/build/wheel
params:
  locator:
    required: false
  dir:
    required: false
    doc: >-
      Project directory, when it is not the working tree root. **Defaults to `location.subdir`**,
      which is where the answer already is for every caller that has one. It did not, and the npm
      tools have read `location.subdir` the whole time: `stub42/pytz` keeps its `setup.py` under
      `src/`, the PyPI rung correctly set `subdir: src` and `output_dir: src/dist`, and this step
      still ran `python -m build` at the tree root and stopped with "Source /src does not appear to
      be a Python project". A field plumbed through one ecosystem and not the other, discovered by
      the first target that needed it.
  constraints:
    required: false
    doc: >-
      A pip constraint file to apply to the frontend's isolated build environment. `PIP_CONSTRAINT`
      is inherited by the pip that `build` runs to populate that environment, which is the only way
      to pin a backend version without also taking over which requirements get installed.
  kind:
    required: false
    default: wheel
    doc: >-
      `wheel` or `sdist` — which distribution to build. **It has to match the artifact the run is
      comparing against.** A PyPI release commonly publishes an sdist and a dozen platform wheels,
      and `ResolvedTarget::preferred` picks the sdist when no pure wheel exists, because a platform
      wheel is built on one machine and does not reproduce on another. This tool always built a
      wheel, so those runs compared a wheel against an sdist and the comparator reported the
      upstream file as malformed gzip — which reads as a corrupt download rather than as two
      different kinds of file.
  no_isolation:
    required: false
    default: "true"
    doc: >-
      Pass `-n`. True by default because a definition pins its build requirements and installs them
      in the deps phase; a caller that pinned nothing passes false and lets the frontend resolve
      them from the project's own declaration.
steps:
  - runs: |
      {%- if with.constraints %}
      export PIP_CONSTRAINT={{ with.constraints }}
      {%- endif %}
      {%- set project = with.dir if with.dir else location.subdir %}
      {{ with.locator }}python3 -m build --{{ with.kind }}{% if with.no_isolation == 'true' %} -n{% endif %}{% if project and project != '.' %} {{ project }}{% endif %}
