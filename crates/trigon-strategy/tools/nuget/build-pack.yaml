# `dotnet pack`, which is what produced the `.nupkg` on the feed.
#
# **`ContinuousIntegrationBuild=true` is the load-bearing flag.** Roslyn's deterministic compilation
# is on by default for SDK projects — measured: two packs of identical source minutes apart produced
# byte-identical assemblies — but the *paths* embedded in the PDB and in the assembly are the
# checkout's absolute paths unless this is set. Without it a rebuild under a different directory
# diverges in every compiled member for a reason that has nothing to do with the code.
id: nuget/build/pack
params:
  dir:
    required: false
    doc: The project directory. Defaults to `location.subdir`.
  configuration:
    required: false
    default: Release
    doc: >-
      `-c`. Release because that is what a publisher ships; a Debug build differs in IL throughout
      and would compare as divergent for a reason that is a configuration rather than a defect.
  version:
    required: false
    doc: >-
      `-p:Version=`. The version the feed served, which is often set at publish time by CI rather
      than committed in the `.csproj` — so a checkout at the release tag frequently carries a
      placeholder, and the package would come out named for the wrong version without this.
  output_dir:
    required: false
    default: trigon-pack
    doc: >-
      **Relative, and resolved against the working directory rather than the project.** `dotnet
      pack -o` is relative to where dotnet was invoked, which is the checkout root even when the
      project is in a subdirectory — so this must match `output_dir` on the strategy, which is also
      joined onto the root. Setting it to the project directory put the package at `/src/artifacts`
      while collection looked in `/src/src/Polly/artifacts`.

      Not `artifacts`: .NET 8's artifacts-output layout uses that name, so on a repository that has
      opted in — Polly has — the pack output lands beside a whole `bin/` tree and collection copies
      the build directory as well as the package. A name nothing else uses keeps the two apart.
steps:
  - runs: |
      {%- set project = with.dir if with.dir else location.subdir %}
      # **Not `needs:`.** That names distribution packages and checks them with `dpkg -s`, and the
      # .NET SDK is not one — Microsoft's images unpack it into /usr/share/dotnet, so the check
      # failed and setup then tried `apt-get install dotnet`, which does not exist. A runtime that
      # arrives as a tarball needs a `command -v`, which is exactly what the `needs:` machinery
      # documents itself as being unable to use for `ca-certificates`. Both are right; they are
      # different questions.
      #
      # The wording matters: `: not found` is what `env/missing-tool` matches on, so this reads as
      # our base image being incomplete — fault `Bug`, ours — rather than as an unknown failure.
      command -v dotnet >/dev/null 2>&1 || {
        echo "dotnet: not found"
        echo "This ecosystem builds with the .NET SDK, which is not a Debian package and so cannot"
        echo "be listed in a strategy's needs: — and `--image auto` cannot add it either, because"
        echo "the SDK version decides the assembly and an image may not supply a decision. Name the"
        echo "parent yourself and auto will add the rest on top of it:"
        echo ""
        echo "    podman pull mcr.microsoft.com/dotnet/sdk:8.0"
        echo "    podman images --no-trunc | grep dotnet/sdk      # prints the image id"
        echo "    export TRIGON_BASE_PARENT=<that id>"
        echo "    trigon rebuild <purl> --image auto"
        echo ""
        echo "or build one image once and pass it with --image:"
        echo "    trigon base-image --from \\$TRIGON_BASE_PARENT"
        echo ""
        echo "A project with .NETPortable targets also needs --pcl-reference-assemblies."
        exit 127
      }
      export DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1
      export NUGET_PACKAGES=/trigon/nuget/packages
      # `--no-restore`: the deps phase already did it, and a restore here would open the network in
      # the phase that is supposed to be observable.
      # **`LanguageTargets`, and it is the whole fix for a large stratum.** A project may override
      # this to point at a Windows-only targets file — Newtonsoft.Json 11.0.1 names
      # `Microsoft.Portable.CSharp.targets` — and on Linux that import fails silently. The inner
      # project then never imports `NuGet.targets`, so the outer restore's call into
      # `_GetRestoreSettingsPerFramework` lands on a project that has no such target and MSBuild
      # reports `MSB4057`, naming a PCL framework. The framework is a bystander: neutralise the
      # override and restore succeeds for every target, PCL included.
      #
      # Safe to pass unconditionally. For an SDK-style C# project this *is* the default value, so
      # a project that does not override it sees no change; only one that points somewhere absent
      # is affected, and for those the alternative is failing.
      CSHARP_TARGETS="$(find /usr/share/dotnet/sdk -maxdepth 2 -name Microsoft.CSharp.targets 2>/dev/null | head -1)"
      if [ -z "$CSHARP_TARGETS" ]; then
        CSHARP_TARGETS="$(find "$(dirname "$(readlink -f "$(command -v dotnet)")")/sdk" -maxdepth 2 -name Microsoft.CSharp.targets 2>/dev/null | head -1)"
      fi
      # **PCL reference assemblies, where the image carries them.** `.NETPortable` profiles have no
      # NuGet package — every plausible id returns nothing — so MSBuild cannot resolve them and fails
      # `MSB3644` advising a Windows Developer Pack. `trigon base-image --pcl-reference-assemblies`
      # vendors Mono's copy; this wires it up when it is there and changes nothing when it is not.
      #
      # Four details, each of which costs a build cycle to find:
      #
      #  * The item glob must live **inside a target**, not in the props body. A props file is evaluated
      #    before `TargetFrameworkVersion` and `TargetFrameworkProfile` are set, so the glob matches
      #    nothing and the whole thing silently does nothing.
      #  * Gate on `TargetFramework`, **not** `TargetFrameworkIdentifier`, which is likewise unset then.
      #  * `TargetFrameworkRootPath` alone is not enough: resolution then picks the profile-less
      #    `v4.5/mscorlib.dll` and fails with `MSB3253` and `CS0400`. The profile's own assemblies have
      #    to be named as `Reference` items.
      #  * Never set these unconditionally. `net20` through `net48` get their reference assemblies from
      #    the implicitly-added `Microsoft.NETFramework.ReferenceAssemblies` package through this same
      #    property, so an unguarded override breaks the four targets that work for free.
      {%- set proj = with.dir if with.dir else location.subdir %}
      PROJECT_DIR="{% if proj and proj != '.' %}{{ proj }}{% else %}.{% endif %}"
      # **`$(SolutionDir)`, because a bare `dotnet pack <csproj>` leaves it unset.** A project may
      # name a pack asset relative to the solution — Castle.Core's package icon is
      # `$(SolutionDir)docs/images/castle-logo.png` — and with no solution in the build the property
      # is empty, so the path resolves under the *project* directory instead and pack dies with
      # `Could not find a part of the path '.../src/Castle.Core/docs/images'`. A solution build would
      # have set it to the directory holding the `.sln`; reconstruct that by walking up from the
      # project to the nearest `.sln`, and fall back to the checkout root, which is where a
      # repository's solution almost always sits and is a harmless value for a project that never
      # reads it.
      SOLUTION_DIR="$PWD"
      d="$PROJECT_DIR"
      while [ "$d" != "." ] && [ "$d" != "/" ]; do
        if ls "$d"/*.sln >/dev/null 2>&1; then SOLUTION_DIR="$PWD/$d"; break; fi
        d="$(dirname "$d")"
      done
      PCL_ROOT=/opt/pcl-reference-assemblies/usr/lib/mono/xbuild-frameworks
      if [ -d "$PCL_ROOT/.NETPortable" ]; then
        echo "vendored PCL reference assemblies found; enabling .NETPortable targets"
        # Chained, not shadowing. MSBuild takes the first `Directory.Build.props` it finds walking up,
        # so writing one here would silently replace a repository's own — which is where a project of
        # this vintage keeps its version and signing settings.
        cat > "$PROJECT_DIR/Directory.Build.props" <<XML
      <Project>
        <!-- Into a property first: a Condition containing a property function whose own arguments
             are single-quoted does not parse, and MSBuild blames the nested quote rather than the
             nesting. No backticks anywhere in this document - the heredoc below is unquoted so the
             reference-assembly path expands, which means the shell also runs backticks, and a
             comment full of them printed "Condition: not found" on stderr and failed the build
             for a reason that was not in the XML at all. -->
        <PropertyGroup>
          <TrigonParentProps>\$([MSBuild]::GetPathOfFileAbove('Directory.Build.props', '\$(MSBuildThisFileDirectory)../'))</TrigonParentProps>
        </PropertyGroup>
        <Import Project="\$(TrigonParentProps)" Condition="'\$(TrigonParentProps)' != ''" />
        <PropertyGroup Condition="\$(TargetFramework.StartsWith('portable'))">
          <TargetFrameworkRootPath>$PCL_ROOT/</TargetFrameworkRootPath>
          <DisableImplicitFrameworkReferences>true</DisableImplicitFrameworkReferences>
          <NoStdLib>true</NoStdLib>
          <!-- The generated AssemblyInfo, suppressed for portable only. These profiles predate
               the attributes the modern SDK writes into it: Profile328 has no
               System.Reflection.AssemblyMetadataAttribute, so generation fails CS0234 before a
               line of the package's own code is compiled. A project of this vintage ships its
               own Properties/AssemblyInfo.cs - which is what the published assemblies were
               built from - so this restores the original arrangement rather than dropping
               information. Not for the other seven targets: they build with generation on, and
               changing what they compile to fix an unrelated profile would be a silent edit to
               outputs that are already correct. -->
          <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
        </PropertyGroup>
        <Target Name="TrigonAddPclReferences" BeforeTargets="BeforeResolveReferences"
                Condition="\$(TargetFramework.StartsWith('portable'))">
          <ItemGroup>
            <Reference Include="$PCL_ROOT/.NETPortable/\$(TargetFrameworkVersion)/Profile/\$(TargetFrameworkProfile)/*.dll">
              <Private>false</Private>
            </Reference>
          </ItemGroup>
        </Target>
      </Project>
      XML
      fi
      set -- pack --no-restore -c {{ with.configuration }} -o {{ with.output_dir }}
      set -- "$@" -p:ContinuousIntegrationBuild=true
      # **`GeneratePackageOnBuild=false`, or `dotnet pack` packs an empty `bin/`.** When a project
      # sets `<GeneratePackageOnBuild>true</GeneratePackageOnBuild>` — Castle.Core does — the `Pack`
      # target stops depending on `Build`, because the package is meant to fall out of the build.
      # So `dotnet pack` runs `Pack` against a directory nothing built and fails
      # `NU5026: ... Castle.Core.dll ... was not found on disk`, naming the first target framework
      # it looks for as though the compile were the problem. It is not: the compile never ran. This
      # is Microsoft's own guidance — the setting and an explicit `pack` do not combine — and it is
      # a no-op for the projects that do not set it.
      set -- "$@" -p:GeneratePackageOnBuild=false
      set -- "$@" -p:SolutionDir="$SOLUTION_DIR/"
      # **`IncludeSymbols=false`, so pack emits one package and not two.** A project may ask for a
      # symbols package — `<IncludeSymbols>true</IncludeSymbols>`, Castle.Core does — and then pack
      # writes `<id>.<v>.nupkg` *and* `<id>.<v>.symbols.nupkg` beside it. The strategy's
      # `output_path` is a glob, `*.nupkg` matches both, and collection cannot say which is the
      # artifact — the run warns `collected no single artifact` and the symbols copy, which carries
      # the `.pdb` the main package does not, then shows up as members only the rebuild has. The
      # published artifact is the main package; the symbols one is a separate feed. Suppressing it
      # is a no-op for the projects that never asked for it.
      set -- "$@" -p:IncludeSymbols=false
      [ -n "$CSHARP_TARGETS" ] && set -- "$@" -p:LanguageTargets="$CSHARP_TARGETS"
      {%- if with.version %}
      set -- "$@" -p:Version={{ with.version }}
      {%- endif %}
      {%- if project and project != '.' %}
      set -- "$@" {{ project }}
      {%- endif %}
      dotnet "$@"
