[package]
name = "trigon-core"
version = "0.0.0"
description = "Pure types for Trigon. No I/O, no async, no cargo features."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# npm's `integrity` is Subresource Integrity, a digest in base64: the lockfile parser keeps it as
# the hex every other digest here is (`lockfile`). Already in the tree, through `trigon-attest`.
base64.workspace = true

