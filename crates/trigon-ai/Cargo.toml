[package]
name = "trigon-ai"
version = "0.0.0"
description = "The search half: strategy inference, build repair, and the budgets that bound them."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
trigon-core.workspace = true
trigon-politeness.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tracing.workspace = true

[dev-dependencies]
# The drift fixtures assert that a salvaged recipe still parses as a strategy, which only the
# strategy parser can say. A dev-dependency, so nothing in the shipped crate links it.
trigon-strategy.workspace = true
